<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; background-color: #f4f4f9; color: #333; }
      .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
      
      .logo { max-width: 100%; height: auto; max-height: 150px; margin-bottom: 20px; border-radius: 8px; }
      
      h1 { color: #007bff; margin-bottom: 5px; font-size: 28px; }
      p { color: #666; margin-bottom: 30px; font-size: 16px; }
      
      /* Big App-Style Buttons */
      .menu-btn { display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 12px; text-decoration: none; box-sizing: border-box; transition: 0.2s; }
      
      .btn-checkin { background-color: #28a745; }
      .btn-checkin:active { background-color: #218838; }
      
      .btn-register { background-color: #007bff; }
      .btn-register:active { background-color: #0056b3; }
      
      .btn-schedule { background-color: #6f42c1; }
      .btn-schedule:active { background-color: #59339d; }
      
      .btn-signup { background-color: #e85d04; }
      .btn-signup:active { background-color: #dc2f02; }

      /* New Website and Facebook Buttons */
      .btn-website { background-color: #17a2b8; } 
      .btn-website:active { background-color: #117a8b; }

      .btn-facebook { background-color: #1877f2; } 
      .btn-facebook:active { background-color: #145dbf; }
    </style>
  </head>
  <body>
    <div class="container">
      
      <img src="https://i.imgur.com/AgHGHTD.png" alt="Hobby Con Logo" class="logo" />
      
      <h1>Hobby Con 2026</h1>
      <p>Welcome to Hobby Con! Check out our links below.:</p>

      <a href="https://script.google.com/macros/s/AKfycbwEAwF2jmvnKFmKIbUNBa-9DdoD_duiDzhvx9tz20st016tXGkjYgvrNEG4GGNMUOiQ/exec" class="menu-btn btn-checkin" target="_top">✅ Daily Check-In</a>
      
      <a href="https://script.google.com/macros/s/AKfycbwEAwF2jmvnKFmKIbUNBa-9DdoD_duiDzhvx9tz20st016tXGkjYgvrNEG4GGNMUOiQ/exec?mode=register" class="menu-btn btn-register" target="_top">📋 Register for Convention</a>
      
      <a href="https://script.google.com/macros/s/AKfycbwEAwF2jmvnKFmKIbUNBa-9DdoD_duiDzhvx9tz20st016tXGkjYgvrNEG4GGNMUOiQ/exec?mode=schedule" class="menu-btn btn-schedule" target="_top">📅 View Event Schedule</a>
      
      <a href="https://www.signupgenius.com/index.cfm?go=s.signup&urlid=10C094CA9A723A4F5C43-63039520-hobby&useFullSite=true#/" class="menu-btn btn-signup" target="_blank">✍️ Signup Genius</a>

      <a href="https://www.thehobbycorner.net/hobby-con" class="menu-btn btn-website" target="_blank">🌐 Official Website</a>

      <a href="https://www.facebook.com/events/1320409716816140" class="menu-btn btn-facebook" target="_blank">📘 Facebook Event Page</a>
      
    </div>
  </body>
</html>
