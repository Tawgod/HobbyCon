<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
      .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
      h2 { color: #333; text-align: center; }
      input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
      button { width: 100%; padding: 15px; font-size: 18px; color: white; background-color: #007bff; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
      button:active { background-color: #0056b3; }
      #message { margin-top: 20px; font-weight: bold; text-align: center; font-size: 16px; }
      .success { color: #28a745; }
      .error { color: #dc3545; }
      
      /* Unified Navigation Styles */
      .nav-section { margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
      .nav-link { color: #007bff; text-decoration: none; font-weight: bold; font-size: 16px; }
      .nav-link:hover { text-decoration: underline; }
      .external-link { color: #e85d04; }
      .success-link { color: #28a745; text-decoration: underline; font-size: 18px; display: block; margin-top: 15px; font-weight: bold;}
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Hobby Con Registration</h2>
      
      <input type="text" id="regName" placeholder="Full Name (Required)" required />
      <input type="tel" id="regPhone" placeholder="Phone Number (Optional)" />
      <input type="email" id="regEmail" placeholder="Email Address (Optional)" />
      <input type="number" id="regCode" placeholder="Create a 6-Digit Code (Required)" required />
      
      <button onclick="submitRegistration()">Register</button>
      <div id="message"></div>

      <div class="nav-section">
        <a href="https://script.google.com/macros/s/AKfycbwEAwF2jmvnKFmKIbUNBa-9DdoD_duiDzhvx9tz20st016tXGkjYgvrNEG4GGNMUOiQ/exec?mode=home" class="nav-link" target="_top">🏠 Back to Home Hub</a>
        <a href="https://script.google.com/macros/s/AKfycbwEAwF2jmvnKFmKIbUNBa-9DdoD_duiDzhvx9tz20st016tXGkjYgvrNEG4GGNMUOiQ/exec" class="nav-link" target="_top">✅ Go to Daily Check-In</a>
        <a href="https://script.google.com/macros/s/AKfycbwEAwF2jmvnKFmKIbUNBa-9DdoD_duiDzhvx9tz20st016tXGkjYgvrNEG4GGNMUOiQ/exec?mode=schedule" class="nav-link" target="_top">📅 View Event Schedule</a>
        <a href="https://www.thehobbycorner.net/hobby-con" class="nav-link external-link" target="_blank">🌐 Official Website</a>
        <a href="https://www.facebook.com/events/1320409716816140" class="nav-link external-link" target="_blank">📘 Facebook Event Page</a>
        <a href="https://www.signupgenius.com/index.cfm?go=s.signup&urlid=10C094CA9A723A4F5C43-63039520-hobby&useFullSite=true#/" class="nav-link external-link" target="_blank">✍️ Sign Up for Games</a>
      </div>
    </div>

    <script>
      function submitRegistration() {
        var name = document.getElementById("regName").value;
        var phone = document.getElementById("regPhone").value;
        var email = document.getElementById("regEmail").value;
        var code = document.getElementById("regCode").value;
        var msgDiv = document.getElementById("message");
        
        // Updated Validation: It no longer checks if the email field is empty
        if (!name || code.length !== 6) {
          msgDiv.className = "error";
          msgDiv.innerHTML = "Please enter your Full Name and ensure your code is exactly 6 digits.";
          return;
        }

        msgDiv.style.color = "black";
        msgDiv.innerHTML = "Checking code availability...";

        google.script.run
          .withSuccessHandler(function(response) {
            if (response.includes("successful")) {
              msgDiv.className = "success";
              msgDiv.innerHTML = response + '<br><br><a href="https://script.google.com/macros/s/AKfycbwEAwF2jmvnKFmKIbUNBa-9DdoD_duiDzhvx9tz20st016tXGkjYgvrNEG4GGNMUOiQ/exec" class="success-link" target="_top">Click here to Check In now!</a>';
              
              document.getElementById("regName").value = "";
              document.getElementById("regPhone").value = "";
              document.getElementById("regEmail").value = "";
              document.getElementById("regCode").value = "";
            } else {
              msgDiv.className = "error";
              msgDiv.innerHTML = response;
            }
          })
          .processRegistration(name, phone, email, code);
      }
    </script>
  </body>
</html>
